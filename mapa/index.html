<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
/* O mundo ocupa a tela inteira; os controles de interação aparecem por proximidade. */
:root{
  --ink:#1b1530; --paper:#ffffff; --muted:#686280; --seal:#c4122f; --brass:#e0b33c; --glass:rgba(27,21,48,.78); --line:rgba(255,255,255,.22);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#7ec3ee;color:var(--paper);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#place b{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
#place span{font-size:12.5px;opacity:.8}
.right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;font-size:13.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#roll{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#roll i{font-style:normal;color:var(--brass);font-weight:700}

.hint{position:fixed;z-index:3;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;opacity:.32;pointer-events:none;text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.hint svg{display:block;width:100%;height:auto;margin-bottom:4px}
.hint.l{left:max(24px,env(safe-area-inset-left,0px))}.hint.r{right:max(24px,env(safe-area-inset-right,0px))}
#toast{position:fixed;left:50%;top:calc(132px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;max-width:min(86vw,420px);text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:600;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}

#joy{position:fixed;z-index:4;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85)}

.world-actions{position:fixed;z-index:7;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;justify-items:center}
.world-actions .btn{white-space:nowrap;border-color:var(--brass)}
.world-actions .btn:disabled{opacity:.6}
.speech-overlay{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:#140e2480}
.speech-form{width:min(100%,360px);display:grid;gap:12px;padding:18px;border:1px solid var(--brass);border-radius:16px;background:var(--ink);box-shadow:0 10px 40px #0005}
.speech-form label{font-family:var(--display);font-size:19px;font-weight:800}
.speech-form input{min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#322747;color:var(--paper);font:16px var(--body);user-select:text;-webkit-user-select:text}
.speech-actions{display:flex;justify-content:flex-end;gap:8px}
.speech-send{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.speech-send:disabled{opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="pill" id="place"><b>Gramado</b><span>Chácara na represa</span></div>
  <div class="right">
    <button class="btn" type="button" id="b-view">Vista: recorte</button>
  </div>
</div>
<div id="joy" hidden><i></i></div>
<div class="hint l" id="hint-l" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3"/><circle cx="50" cy="50" r="17" fill="#fff"/><path d="M50 9l8 10H42zM50 91l8-10H42zM9 50l10-8v16zM91 50l-10-8v16z" fill="#fff"/></svg><span>andar</span></div>
<div class="hint r" id="hint-r" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3"/><path d="M26 44a26 26 0 1 1 5 24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M14 40l14 14 8-18z" fill="#fff"/><circle cx="50" cy="50" r="7" fill="#fff"/></svg><span>olhar</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="world-actions">
  <button id="light-switch" class="btn" type="button" hidden>Apertar</button>
  <button id="talk" class="btn" type="button" hidden></button>
</div>
<div id="speech-overlay" class="speech-overlay" hidden>
  <form id="speech-form" class="speech-form" role="dialog" aria-modal="true" aria-labelledby="speech-label">
    <label id="speech-label" for="speech-text"></label>
    <input id="speech-text" name="message" type="text" maxlength="100" placeholder="Mensagem" autocomplete="off" required>
    <div class="speech-actions">
      <button id="speech-cancel" class="btn" type="button">Cancelar</button>
      <button id="speech-send" class="btn speech-send" type="submit">Enviar</button>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* ---------- elenco ---------- */

 {id:'bruno',nick:'Bruno',org:1,s:1,skin:0xf29a56,hair:0xe0627a,style:'shoulder',beard:0,sunga:0x2a2f7a},

 {id:'gherardi',nick:'Gherardi',s:1.1,skin:0xf6ab7a,hair:0x6a3c2c,style:'quiff',beard:0x5e3426,sunga:0x2a3070},

var seed=20261118;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}

var MATS={};function M(c){return MATS[c]||(MATS[c]=lam(c));}
var SMS={};function S(c){return SMS[c]||(SMS[c]=new T.MeshLambertMaterial({color:c}));}
function ball(r,c,x,y,z,p,sx,sy,sz){var m=new T.Mesh(new T.SphereGeometry(r,14,10),typeof c==='number'?S(c):c);m.position.set(x,y,z);if(sx)m.scale.set(sx,sy,sz);(p||scene).add(m);return m;}
function rod(rt,rb,h,c,x,y,z,p){var m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,12),typeof c==='number'?S(c):c);m.position.set(x,y,z);(p||scene).add(m);return m;}
function c01(v){return v<0?0:v>1?1:v;}
function ease01(v){v=c01(v);return v*v*(3-2*v);}
var LAKE_FENCE_Z=-47.5,MIRANTE_CREST_Z=-40.5,MIRANTE_FOOT_Z=-43.5;
var PX0=-16,PX1=-2,PZ0=-42.2,PZ1=-30;
var POOL_WALL_Z=-42.5,POOL_LIP_Z=-42.77,POOL_FOOT_Z=-43.15,POOL_BANK_Y=-2.12;
var POOL_BANK_BLEND=3.5;
function miranteBank(x){return ease01((x-13)/5)*ease01((31-x)/5);}
function Hs(x,z){var y=0,s;if(z>6){s=z-6;y+=6*(1-Math.exp(-s/8))+s*.05;}
  if(z<-39){
    var gentle=ease01((-39-z)/(-39-LAKE_FENCE_Z));
    var steep=ease01((MIRANTE_CREST_Z-z)/(MIRANTE_CREST_Z-MIRANTE_FOOT_Z));
    var drop=1.75*(gentle+miranteBank(x)*(steep-gentle));
    s=Math.max(0,LAKE_FENCE_Z-z);
    var shore=Math.max(0,-44-z);
    y-=Math.max(drop+s*.027,shore<16?shore*.04:.64+(shore-16)*(shore-16)/(shore-10)*.35);}
  var e=Math.abs(x)-70;if(e>0)y+=e*e/(e+10)*0.12;return y;}
function Tf(x,z){var e=z<-21.7?-25.6:-21.05;if(x>=e)return 0;var w=.3;if(z>-7)w=.3+(z+7)*1.2;if(z>-19.5&&z<-17.1)w=4.6;
  if(z<-42.4)w+=4.2*ease01((-42.4-z)/2.5);
  return c01((e-x)/w);}
function Hc(x,z,t){var y=Hs(x,z),low=z>6?y-2.2:Math.min(y,-2.2);y+=t*(low-y);
  if(z<=POOL_WALL_Z&&z>LAKE_FENCE_Z&&x>PX0-POOL_BANK_BLEND&&x<PX1+POOL_BANK_BLEND){
    var across=ease01(1+(x-PX0)/POOL_BANK_BLEND)*ease01(1+(PX1-x)/POOL_BANK_BLEND);
    var underLip=ease01((z-LAKE_FENCE_Z)/2.5);
    y+=Math.min(0,POOL_BANK_Y-y)*across*underLip;}
  return y;}
function H(x,z){return Hc(x,z,Tf(x,z));}
function Hmesh(x,z){if(z>-4.5||z<-42.4)return H(x,z);var t=0,i,j;for(i=-1;i<=1;i++)for(j=-1;j<=1;j++)t=Math.max(t,Tf(x+i*2.5,z+j*2.5));return Hc(x,z,t);}
var scene=new T.Scene();
function box(w,h,d,c,x,y,z,p){var m=new T.Mesh(new T.BoxGeometry(w,h,d),typeof c==='number'?M(c):c);m.position.set(x,y,z);(p||scene).add(m);return m;}
function cyl(rt,rb,h,c,x,y,z,p,seg){var m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg||8),typeof c==='number'?M(c):c);m.position.set(x,y,z);(p||scene).add(m);return m;}
function gable(w,h,d,c){var a=w/2,b=d/2,v=[ -a,0,-b, a,0,-b, a,h,0,  -a,0,-b, a,h,0, -a,h,0,   a,0,b, -a,0,b, -a,h,0,  a,0,b, -a,h,0, a,h,0,

function textTex(draw,w,h){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);var t=new T.CanvasTexture(c);t.minFilter=T.LinearFilter;return t;}

  var t=textTex(function(g,w,h){g.font='700 34px Figtree, system-ui, sans-serif';g.fillStyle=bg||'rgba(27,21,48,.86)';rrect(g,2,8,w-4,48,24);g.fill();g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,33);},W,64);

/* ---------- terreno e represa ---------- */
(function(){
  var x0=12.5,x1=32.5,z0=-47.5,z1=-37.5,gridStep=2.5;
  var ground=new T.PlaneGeometry(320,300,128,120);ground.rotateX(-Math.PI/2);ground.translate(0,0,60);
  var positions=ground.attributes.position,indices=ground.index.array,keep=[];
  for(var i=0;i<indices.length;i+=3){
    var x=(positions.getX(indices[i])+positions.getX(indices[i+1])+positions.getX(indices[i+2]))/3;
    var z=(positions.getZ(indices[i])+positions.getZ(indices[i+1])+positions.getZ(indices[i+2]))/3;
    if(x>x0&&x<x1&&z>z0&&z<z1)continue;
    keep.push(indices[i],indices[i+1],indices[i+2]);
  }
  ground.setIndex(keep);
  var bank=new T.PlaneGeometry(x1-x0,z1-z0,40,40);
  bank.rotateX(-Math.PI/2);bank.translate((x0+x1)/2,0,(z0+z1)/2);
  var earth=new T.Color(0xaa915b),material=new T.MeshLambertMaterial({vertexColors:true});
  for(var g of [ground,bank]){
    var p=g.attributes.position,col=[],c=new T.Color();
    for(var i=0;i<p.count;i++){
      var x=p.getX(i),z=p.getZ(i),height=Hmesh(x,z);
      if(g===bank){
        // A borda detalhada segue os segmentos do terreno vizinho para fechar a junção.
        var alongZ=x===x0||x===x1;
        if(alongZ||z===z0||z===z1){
          var along=alongZ?z:x,start=Math.floor(along/gridStep)*gridStep,end=start+gridStep;
          var low=alongZ?Hmesh(x,start):Hmesh(start,z),high=alongZ?Hmesh(x,end):Hmesh(end,z);
          height=T.MathUtils.lerp(low,high,(along-start)/gridStep);
        }
      }
      p.setY(i,height);
      if(z<-62)c.setHex(0xd8c79a);
      else{
        var n=Math.sin(x*.21)*Math.cos(z*.17)*.5+.5;
        c.setHSL(.26+n*.03,.46,.34+n*.06+(rnd()-.5)*.03);
        var worn=miranteBank(x)*ease01((MIRANTE_CREST_Z+.45-z)/.8)*ease01((z-LAKE_FENCE_Z-.3)/1.6);
        var streak=.65+.2*Math.sin(x*3+Math.sin(z*1.4)*.5);
        c.lerp(earth,worn*streak);
      }
      col.push(c.r,c.g,c.b);
    }
    g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.computeVertexNormals();
    scene.add(new T.Mesh(g,material));
  }
})();

var hillM=lam(0x3f6b3c);
[[-260,-250,120,26],[-120,-290,150,34],[40,-270,130,24],[190,-300,170,38],[330,-250,120,22],[-380,-230,110,20],[110,-210,60,10],[-190,-200,70,12],[-40,-175,34,5]].forEach(function(h){

/* ---------- colisão ---------- */
var BOXES=[],CIRC=[];
function solid(x0,x1,z0,z1){BOXES.push([Math.min(x0,x1),Math.max(x0,x1),Math.min(z0,z1),Math.max(z0,z1)]);}
function collide(p,r){var i,b,c;
  for(i=0;i<BOXES.length;i++){b=BOXES[i];if(p.x>b[0]-r&&p.x<b[1]+r&&p.z>b[2]-r&&p.z<b[3]+r){
    var dl=p.x-(b[0]-r),dr=(b[1]+r)-p.x,dn=p.z-(b[2]-r),ds=(b[3]+r)-p.z,m=Math.min(dl,dr,dn,ds);
    if(m===dl)p.x=b[0]-r;else if(m===dr)p.x=b[1]+r;else if(m===dn)p.z=b[2]-r;else p.z=b[3]+r;}}
  for(i=0;i<CIRC.length;i++){c=CIRC[i];var dx=p.x-c[0],dz=p.z-c[1],d=Math.sqrt(dx*dx+dz*dz),R=c[2]+r;if(d<R&&d>1e-4){p.x=c[0]+dx/d*R;p.z=c[1]+dz/d*R;}}
  p.x=Math.max(-88,Math.min(88,p.x));p.z=Math.max(-71,Math.min(84,p.z));}

/* ---------- casa principal (com o plenário dentro) ---------- */

bView.addEventListener('click',function(){vmode=(vmode+1)%3;bView.textContent=VN[vmode];});
var hintL=document.getElementById('hint-l'),hintR=document.getElementById('hint-r'),touch=false;try{touch=matchMedia('(pointer:coarse)').matches;}catch(_){}
setSun(false);
var switchButton=document.getElementById('light-switch'),switchPending=false;
function nearSkySwitch(){return me&&!boat&&!me.st&&me.pos.x>HX1&&Math.hypot(me.pos.x-skySwitch.position.x,me.pos.z-skySwitch.position.z)<3.1;}
switchButton.addEventListener('click',function(){
  if(switchPending||!nearSkySwitch())return;
  if(!roomOnline){toast('Conecte-se para apertar o interruptor.');return;}
  switchPending=true;switchButton.disabled=true;

});
var KX=-29,KZ=-68.3;
function dock(){boat=false;kayak.position.set(KX,H(KX,KZ)+.22,KZ);kayak.rotation.set(0,.35,0);}

var nextPositionSave=0,lastPositionSaved='';
function saveTravelPosition(){
  if(!me)return;
  var position=JSON.stringify({
    x:me.pos.x,z:me.pos.z,yaw:yaw,pitch:pitch,dist:dist,
    heading:me.g.rotation.y,boat:boat,dockX:KX
  });
  if(position===lastPositionSaved)return;
  try{localStorage.setItem('congresso-mapa-posicao-'+me.p.id,position);lastPositionSaved=position;}catch(_){}
}
function savedTravelPosition(){
  try{
    var position=JSON.parse(localStorage.getItem('congresso-mapa-posicao-'+me.p.id));
    if(!position||![position.x,position.z,position.yaw,position.pitch,position.dist,position.heading,position.dockX].every(Number.isFinite))return null;
    if(position.pitch<.12||position.pitch>1.15||position.dist<5||position.dist>22||Math.abs(position.dockX)>84)return null;

      if(Math.abs(position.x)>110||position.z<-150||position.z>-72)return null;

}

/* ---------- conversa por proximidade ---------- */
var talkButton=document.getElementById('talk'),speechOverlay=document.getElementById('speech-overlay');
var speechForm=document.getElementById('speech-form'),speechText=document.getElementById('speech-text');
var speechSend=document.getElementById('speech-send'),speechLabel=document.getElementById('speech-label');
var speechTarget=null,speechTap=null,nearbyPeer=null,roomOnline=false,replying=false,requestNumber=0;
var balloons=new Map(),speechRay=new T.Raycaster(),speechPointer=new T.Vector2(),viewpoint=new T.Vector3();
var bubbleFont='600 30px Figtree, system-ui, sans-serif';

function canTalk(c){
  return c.remote&&Math.abs(c.remoteY-me.g.position.y)<3&&Math.hypot(c.pos.x-me.pos.x,c.pos.z-me.pos.z)<=5.5;
}
function updateTalk(){
  var next=null,distance=Infinity;
  if(me&&roomOnline&&!speechTarget){
    for(var c of chars){
      if(c===me||!canTalk(c))continue;
      var d=Math.hypot(c.pos.x-me.pos.x,c.pos.z-me.pos.z);
      if(d<distance){distance=d;next=c;}
    }
  }
  if(next===nearbyPeer)return;
  nearbyPeer=next;talkButton.hidden=!next;
  if(next)talkButton.textContent='Conversar com '+next.p.nick;
}
function openSpeech(c,reply){
  if(!roomOnline||!c?.remote||(!reply&&!canTalk(c)))return;
  requestNumber++;speechTarget=c;replying=reply;keys={};joy.x=joy.y=0;
  speechLabel.textContent='Conversar com '+c.p.nick;
  speechText.value='';speechSend.disabled=false;speechOverlay.hidden=false;
  updateTalk();speechText.focus();
}
function closeSpeech(){
  requestNumber++;speechTarget=null;speechOverlay.hidden=true;
  updateTalk();if(!talkButton.hidden)talkButton.focus();
}
talkButton.addEventListener('click',function(){openSpeech(nearbyPeer,false);});
document.getElementById('speech-cancel').addEventListener('click',closeSpeech);
speechForm.addEventListener('submit',function(event){
  event.preventDefault();
  if(speechSend.disabled||!speechTarget)return;
  if(!roomOnline||!speechTarget.remote||(!replying&&!canTalk(speechTarget))){
    closeSpeech();toast('O congressista está fora de alcance.');return;
  }
  var text=speechText.value.trim();if(!text)return;
  speechSend.disabled=true;
  post('say',{to:speechTarget.p.id,text:text,request:++requestNumber});
});
function removeBalloon(id){
  var bubble=balloons.get(id);if(!bubble)return;
  scene.remove(bubble.mesh);bubble.mesh.geometry.dispose();
  bubble.mesh.material.map.dispose();bubble.mesh.material.dispose();balloons.delete(id);
}
function addBalloon(id,message){
  if(!message){removeBalloon(id);return;}
  var from=charById.get(message.from),to=charById.get(message.to);
  var text=message.text.trim();
  if(!text||!from||!to||balloons.has(id)||message.remaining<=0)return;
  mctx.font=bubbleFont;
  var lines=[],line='';
  for(var char of text){
    if(line&&mctx.measureText(line+char).width>430){
      var space=line.lastIndexOf(' ');
      if(space>0){lines.push(line.slice(0,space));line=line.slice(space+1);}
      else{lines.push(line);line='';}
    }
    if(line||char!==' ')line+=char;
  }
  if(line)lines.push(line);
  var w=Math.ceil(Math.max(...lines.map(function(value){return mctx.measureText(value).width;})))+42;
  var h=lines.length*38+38;
  var texture=textTex(function(g){
    rrect(g,2,2,w-4,h-16,15);
    g.fillStyle='#1b1530';g.fill();g.strokeStyle='#e0b33c';g.lineWidth=3;g.stroke();
    g.beginPath();g.moveTo(w/2-10,h-15);g.lineTo(w/2,h-2);g.lineTo(w/2+10,h-15);
    g.fill();g.stroke();
    g.font=bubbleFont;g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
    lines.forEach(function(value,i){g.fillText(value,w/2,24+i*38);});
  },w,h);
  var mesh=new T.Mesh(new T.PlaneGeometry(w/135,h/135),
    new T.MeshBasicMaterial({map:texture,transparent:true,side:T.FrontSide,depthWrite:false}));
  mesh.visible=false;scene.add(mesh);
  balloons.set(id,{mesh:mesh,from:from,to:to,expires:performance.now()+message.remaining,height:h/135});
}
function drawBalloons(){
  var now=performance.now(),heights=new Map();
  for(var [id,bubble] of balloons){
    if(now>=bubble.expires){removeBalloon(id);continue;}
    var from=bubble.from,to=bubble.to,mesh=bubble.mesh;
    mesh.visible=(from===me||!!from.remote)&&(to===me||!!to.remote);
    if(!mesh.visible)continue;
    var base=heights.get(from)||from.s*2.55+.75;
    mesh.position.copy(from.g.position);mesh.position.y+=base+bubble.height/2;
    heights.set(from,base+bubble.height+.12);
    if(to===me)viewpoint.copy(camera.position);
    else if(to.cameraView)viewpoint.copy(to.cameraView);
    else{viewpoint.copy(to.g.position);viewpoint.y+=2.5;}
    mesh.lookAt(viewpoint);
  }
}
function replyAt(event){
  if(!roomOnline||!balloons.size)return;
  var rect=cv.getBoundingClientRect();
  speechPointer.set((event.clientX-rect.left)/rect.width*2-1,1-(event.clientY-rect.top)/rect.height*2);
  speechRay.setFromCamera(speechPointer,camera);
  var displayed=[...balloons.values()].filter(function(b){return b.mesh.visible&&b.expires>performance.now();});
  var hit=speechRay.intersectObjects(displayed.map(function(b){return b.mesh;}))[0];
  if(!hit)return;
  var bubble=displayed.find(function(b){return b.mesh===hit.object;});
  if(bubble.to===me)openSpeech(bubble.from,true);
}

/* Pose wire format: centimetres, angle in hundredths of a radian, and motion 0–10. */
var sentAt=-Infinity,sentMotion=-1,sentContact=null;
function sendPose(c){
  var motion=boat?(c.moving?9:8):c.st===POOL_FALL?6:c.st===POOL_RECOVER?POOL_RECOVER_MOTION:c.st===2?5:c.st===1?4:c.sliding?7:c.swim>.5?(c.moving?3:2):c.moving?1:0;
  var bump=contactTime>=.25&&(motion===1||motion===3)?contactPeer?.p.id:null;
  var now=performance.now();if(now-sentAt<250&&sentMotion===motion&&sentContact===bump)return;
  sentAt=now;sentMotion=motion;sentContact=bump;
  var a=c.g.rotation.y,y=motion===2?-1.2*c.s:c.g.position.y;
  if(c.st===POOL_FALL)y=c.fallY;
  if(c.st===POOL_RECOVER)y=H(c.pos.x,c.pos.z);
  post('pose',{pose:{x:Math.round(c.pos.x*100),y:Math.round(y*100),z:Math.round(c.pos.z*100),a:Math.round(Math.atan2(Math.sin(a),Math.cos(a))*100),m:motion,
    cx:Math.round(camera.position.x*100),cy:Math.round(camera.position.y*100),cz:Math.round(camera.position.z*100),bump:bump}});
}
function setPeer(c,pose){
  if(!pose){c.remote=null;c.cameraView=null;if(c.remoteKayak)c.remoteKayak.visible=false;return;}
  if(![pose.x,pose.y,pose.z,pose.a,pose.m].every(Number.isFinite))return;
  var x=pose.x/100,y=pose.y/100,z=pose.z/100,a=pose.a/100;
  if(!c.remote||Math.hypot(x-c.pos.x,z-c.pos.z)>10){c.pos.set(x,0,z);c.remoteY=y;c.g.rotation.y=a;c.swim=0;c.amp=0;}
  var previous=c.remote?.m;
  if(pose.m!==previous){
    if(pose.m===5)c.stT=STUN_SECONDS-(previous===POOL_RECOVER_MOTION?.35:0);
    if(pose.m===6)c.stT=0;
    if(pose.m===POOL_RECOVER_MOTION)c.stT=POOL_RECOVER_SECONDS;
  }
  var remoteCamera=[pose.cx,pose.cy,pose.cz].every(Number.isFinite)?new T.Vector3(pose.cx/100,pose.cy/100,pose.cz/100):null;
  if(remoteCamera&&!c.cameraView)c.cameraView=remoteCamera.clone();
  c.remote={x:x,y:y,z:z,a:a,m:pose.m,camera:remoteCamera};
}
function drawPeer(c,dt){
  var target=c.remote,m=target.m,alpha=Math.min(1,dt*11);
  if(target.camera)c.cameraView.lerp(target.camera,alpha);
  c.pos.x+=(target.x-c.pos.x)*alpha;c.pos.z+=(target.z-c.pos.z)*alpha;c.remoteY+=(target.y-c.remoteY)*alpha;
  var d=target.a-c.g.rotation.y;c.g.rotation.y+=Math.atan2(Math.sin(d),Math.cos(d))*alpha;
  c.st=m===4?1:m===5?2:m===6?POOL_FALL:m===POOL_RECOVER_MOTION?POOL_RECOVER:0;c.sliding=m===7;c.moving=m===1||m===3||m===9;
  if(c.st===POOL_FALL)c.stT+=dt;
  if(c.st===2||c.st===POOL_RECOVER)c.stT=Math.max(0,c.stT-dt);
  var rowing=m===8||m===9;
  if(rowing&&!c.remoteKayak){c.remoteKayak=kayak.clone();scene.add(c.remoteKayak);}
  if(c.remoteKayak){c.remoteKayak.visible=rowing;if(rowing){
    var heading=c.g.rotation.y;
    c.remoteKayak.position.set(c.pos.x+Math.sin(heading)*.8,-2.3,c.pos.z+Math.cos(heading)*.8);
    c.remoteKayak.rotation.set(0,heading-Math.PI/2,0);}}
  place(c,dt);
}
addEventListener('message',function(event){
  if(event.origin!==location.origin||event.source!==window.parent)return;
  var data=event.data;if(data?.channel!=='congresso-mapa')return;
  if(data.type==='start'&&!me){
    me=charById.get(data.avatar);if(!me){post('error');return;}
    chars.forEach(function(c){c.g.visible=true;});
    var saved=savedTravelPosition();
    me.pos.set(saved?.x??38,0,saved?.z??47);me.pz=me.pos.z;
    yaw=saved?.yaw??.29;pitch=saved?.pitch??.26;dist=saved?.dist??9.5;
    me.g.rotation.y=saved?.heading??yaw+Math.PI;
    if(saved){KX=saved.dockX;dock();boat=saved.boat===true;boatArm=false;}
    me.swim=inPool(me.pos)?1:0;place(me,0);
    camPos.set(me.pos.x+Math.sin(yaw)*Math.cos(pitch)*dist,
      me.g.position.y+1.8+Math.sin(pitch)*dist,me.pos.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  }else if(data.type==='peer'){
    var peer=charById.get(data.id);
    if(peer&&peer!==me){setPeer(peer,data.pose);receivePressure(peer,data.pose);}
  }else if(data.type==='speech'){
    addBalloon(data.id,data.message);
  }else if(data.type==='sun'){
    setSun(data.sunset===true);
  }else if(data.type==='toggle-sun-result'){
    switchPending=false;switchButton.disabled=false;
    if(!data.ok)toast('Não foi possível apertar o interruptor.');
  }else if(data.type==='online'){
    roomOnline=data.online===true;
    if(!roomOnline){
      pressure=null;contactPeer=null;contactTime=0;
      switchPending=false;switchButton.disabled=false;
      for(var id of balloons.keys())removeBalloon(id);
      if(speechTarget)closeSpeech();
    }
  }else if(data.type==='say-result'&&data.request===requestNumber&&speechTarget){
    if(data.ok)closeSpeech();
    else{closeSpeech();toast('Não foi possível enviar a mensagem.');}
  }
});

/* ---------- laço ---------- */
var clock=new T.Clock(),camPos=new T.Vector3(8,8,22),tgt=new T.Vector3(),v=new T.Vector3(),tt=0;
var reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function under(b,p){return p.x>b[0]&&p.x<b[1]&&p.z>b[2]&&p.z<b[3];}
function frame(){requestAnimationFrame(frame);var dt=Math.min(.05,clock.getDelta());tt+=dt;
  var i,c;

  if(me){var ix=joy.x,iy=-joy.y;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iy+=1;if(keys.s||keys.arrowdown)iy-=1;
    var fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);var mag=Math.min(1,Math.hypot(ix,iy));
    if(me.st){me.moving=false;pressure=null;contactPeer=null;contactTime=0;}
    else if(boat){if(mag>.12){var bx=fx*iy+rx*ix,bz=fz*iy+rz*ix,bl=Math.hypot(bx,bz)||1;me.pos.x=Math.max(-110,Math.min(110,me.pos.x+bx/bl*6*mag*dt));me.pos.z=Math.max(-150,Math.min(-72,me.pos.z+bz/bl*6*mag*dt));
        if(me.pos.z>-72.2&&bz>0){KX=Math.max(-84,Math.min(84,me.pos.x));dock();me.pos.set(KX+1.8,0,-66.4);boatArm=false;toast('Caiaque na areia.',1800);}
        var tr=Math.atan2(bx,bz),dr=tr-me.g.rotation.y;while(dr>Math.PI)dr-=6.2832;while(dr<-Math.PI)dr+=6.2832;me.g.rotation.y+=dr*Math.min(1,dt*4);me.moving=true;}else me.moving=false;
      if(boat){var kr=me.g.rotation.y;kayak.position.set(me.pos.x+Math.sin(kr)*.8,-2.3+Math.sin(tt*1.6)*.03,me.pos.z+Math.cos(kr)*.8);kayak.rotation.set(0,kr-Math.PI/2,0);}}
    else{
      var drift=pressureVelocity(),walking=mag>.12;
      if(walking||drift){
        var vx=walking?7.2*(fx*iy+rx*ix)/Math.max(1,Math.hypot(ix,iy)):0;
        var vz=walking?7.2*(fz*iy+rz*ix)/Math.max(1,Math.hypot(ix,iy)):0;
        if(drift){vx+=drift.x;vz+=drift.z;}
        var heading=me.g.rotation.y;
        step(me,vx,vz,Math.min(7.2,Math.hypot(vx,vz)),dt,mag>.55&&!drift);
        if(!walking&&!me.st){me.moving=false;me.g.rotation.y=heading;}
      }else{me.moving=false;contactPeer=null;contactTime=0;}
    }
    if(!boat){var kd=Math.hypot(me.pos.x-KX,me.pos.z-KZ);if(!boatArm&&kd>3.2)boatArm=true;
      if(boatArm&&kd<1.5&&!me.st){boat=true;me.pos.set(KX,0,-74.5);me.g.rotation.y=Math.PI;yaw=0;toast('Reme para onde quiser. As capivaras têm preferência.',3000);}}}
  hintL.hidden=!(touch&&me&&!joy.on);hintR.hidden=!(touch&&me&&!look.on);
  for(i=0;i<chars.length;i++){c=chars[i];
    if(c!==me){if(c.remote)drawPeer(c,dt);else if(me)restAvatar(c,dt);continue;}
    if(c.st===0&&c.pos.z<c.pz&&c.pos.z<MIRANTE_CREST_Z-.4&&c.pos.z>MIRANTE_FOOT_Z&&miranteBank(c.pos.x)>.7&&!(boat&&c===me)){c.st=1;c.g.rotation.y=Math.PI;}
    if(c.st===1){c.pos.z-=9*dt;c.moving=false;if(c.pos.z<=LAKE_FENCE_Z+1.2){c.pos.z=LAKE_FENCE_Z+1.2;stun(c,'Desceu rolando. A cerca agradece a visita.');}}
    else if(c.st===POOL_FALL){
      c.fallY-=11*(c.stT+dt/2)*dt;c.stT+=dt;
      if(c.fallY<=H(c.pos.x,c.pos.z)){c.st=POOL_RECOVER;c.stT=POOL_RECOVER_SECONDS;}}
    else if(c.st===POOL_RECOVER){
      c.stT-=dt;c.moving=false;
      if(c.stT<=0){stun(c);c.stT-=.35;}}
    else if(c.st===2){c.stT-=dt;c.moving=false;if(c.stT<=0)c.st=0;}
    c.pz=c.pos.z;
    if(c.pos.x>10&&c.pos.x<14&&c.pos.z>7.3&&c.pos.z<17){c.pos.z-=9*dt;c.sliding=true;c.g.rotation.y=Math.PI;}
    else if(c.sliding){c.sliding=false;toast('Descida na lona homologada pela COMORG.',2600);}
    place(c,dt);}
  moveDog(dt);
  shark.rotation.y=Math.sin(tt*1.4)*.5;shark.position.y=Math.abs(Math.sin(tt*3))*.15;
  showerW.material.opacity=.38+Math.sin(tt*23)*.1;showerW.rotation.y=tt*5;
  for(i=0;i<capys.length;i++){var cp=capys[i];cp.g.position.y=cp.y+(cp.wet?Math.sin(tt*1.3+cp.ph)*.05:0);if(!cp.wet)cp.g.rotation.x=Math.sin(tt*.9+cp.ph)*.03;}
  flame.scale.set(1+Math.sin(tt*11)*.12,1+Math.sin(tt*7)*.2,1+Math.cos(tt*9)*.12);
  pool.position.y=.16+Math.sin(tt*1.5)*.015;
  if(!reduceMotion.matches){
    var lockAcceleration=-9.81/.94*Math.sin(gateLockAngle)-.65*gateLockVelocity;
    gateLockVelocity+=lockAcceleration*dt;gateLockAngle+=gateLockVelocity*dt;
  }
  gateLock.rotation.z=reduceMotion.matches?0:gateLockAngle;
  /* câmera e telhados */
  var f=me?me.pos:v.set(-4,0,-14),fy=me?me.g.position.y:0;
  var a=me?yaw:tt*.08,pp=me?pitch:.5,dd=me?dist:38;
  var cx=f.x+Math.sin(a)*Math.cos(pp)*dd,cz=f.z+Math.cos(a)*Math.cos(pp)*dd,cy=fy+1.8+Math.sin(pp)*dd;
  for(var q=0;q<8&&cx>-4.6&&cx<2.6&&cz>16.4&&cz<23.6&&cy<H(-1,20)+8.5;q++){dd*=.8;cx=f.x+Math.sin(a)*Math.cos(pp)*dd;cz=f.z+Math.cos(a)*Math.cos(pp)*dd;cy=fy+1.8+Math.sin(pp)*dd;}cy=Math.max(cy,H(cx,cz)+1.2,cz<-67?-1.6:-99);
  camPos.lerp(v.set(cx,cy,cz),Math.min(1,dt*(me?9:2)));camera.position.copy(camPos);tgt.set(f.x,fy+1.9,f.z);camera.lookAt(tgt);
  if(me){
    sendPose(me);updateTalk();drawBalloons();
    switchButton.hidden=!nearSkySwitch()||!!speechTarget;
    if(tt>=nextPositionSave){saveTravelPosition();nextPositionSave=tt+1;}
  }
  switchRocker.rotation.x+=((sunset?-.24:.24)-switchRocker.rotation.x)*Math.min(1,dt*12);
  var nearH=me&&under([HX0,HX1,HZ0,HZ1],me.pos),nearR=me&&under([47,57,-19.25,-12.75],me.pos);
  var nearQ=me&&under([-10.5,4.6,-7,4],me.pos),underHouseRoof=me&&under([-22,5.5,-22.5,-3.5],me.pos);
  clipH.constant+=((vmode===2||(vmode===1&&nearH)?1:4.3)-clipH.constant)*Math.min(1,dt*8);clipR.constant+=((vmode===2||(vmode===1&&nearR)?1:4.3)-clipR.constant)*Math.min(1,dt*8);
  decoH.visible=clipH.constant>3.3;decoR.visible=clipR.constant>3.3;
  roofHouse.visible=vmode===0||(vmode===1&&!underHouseRoof);
  roofQ.visible=vmode===0||(vmode===1&&!nearQ);
  roofR.visible=vmode===0||(vmode===1&&!nearR);
  for(i=0;i<PLACES.length;i++)if(PLACES[i].s){var Q=PLACES[i],dq=Math.hypot(f.x-Q.x,f.z-Q.z);Q.s.material.opacity=me?Math.max(0,Math.min(.9,(dq-(Q.r||9)-3)/9)):.9;}
  if(me){var best=null;for(i=0;i<PLACES.length;i++){var P=PLACES[i];if(P.box?under(P.box,me.pos):Math.hypot(me.pos.x-P.x,me.pos.z-P.z)<P.r){best=P;break;}}
    if(best)setPlace(best.n,best.d);else setPlace('Gramado','Chácara na represa');}
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on');}
  renderer.render(scene,camera);}
frame();
post('ready');
})();
