<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* O mundo ocupa a tela inteira; os controles de interação aparecem por proximidade. */
:root{
  --ink:#1b1530; --paper:#ffffff; --muted:#686280; --seal:#c4122f; --brass:#e0b33c; --glass:rgba(27,21,48,.78); --line:rgba(255,255,255,.22);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#7ec3ee;color:var(--paper);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#place b{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
#place span{font-size:12.5px;opacity:.8}
.right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;font-size:13.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#roll{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#roll i{font-style:normal;color:var(--brass);font-weight:700}

.hint{position:fixed;z-index:3;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;opacity:.32;pointer-events:none;text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.hint svg{display:block;width:100%;height:auto;margin-bottom:4px}
.hint.l{left:max(24px,env(safe-area-inset-left,0px))}.hint.r{right:max(24px,env(safe-area-inset-right,0px))}
#toast{position:fixed;left:50%;top:calc(132px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;max-width:min(86vw,420px);text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:600;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}

#joy{position:fixed;z-index:4;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85)}

.world-actions{position:fixed;z-index:7;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;justify-items:center}
.world-actions .btn{white-space:nowrap;border-color:var(--brass)}
.world-actions .btn:disabled{opacity:.6}
.speech-edge{position:fixed;z-index:6;top:24%;bottom:25%;width:min(calc(50vw - 16px),220px);display:flex;flex-direction:column;justify-content:center;gap:6px;pointer-events:none}
.speech-edge.left{left:max(8px,env(safe-area-inset-left,0px));align-items:flex-start}
.speech-edge.right{right:max(8px,env(safe-area-inset-right,0px));align-items:flex-end}
.speech-edge button{pointer-events:auto;max-width:100%;padding:7px 10px;border:1px solid var(--brass);border-radius:12px;background:var(--ink);text-align:left;overflow-wrap:anywhere;font-size:14px;line-height:1.2}
.speech-edge b{display:block;color:var(--brass);font-size:12px;margin-bottom:3px}
.speech-overlay{position:fixed;z-index:8;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));display:grid;justify-items:center;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.speech-form{pointer-events:auto;width:min(100%,430px);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--brass);border-radius:16px;background:var(--ink);box-shadow:0 10px 30px #0006}
.speech-form label{grid-column:1;font-family:var(--display);font-size:15px;font-weight:800;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.speech-form #speech-cancel{grid-column:2;justify-self:end;padding:5px 10px;font-size:12.5px}
.speech-form input{grid-column:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#322747;color:var(--paper);font:16px var(--body);user-select:text;-webkit-user-select:text}
.speech-form .speech-send{grid-column:2}
body.composing .hud{visibility:hidden}
#cans-hud{position:fixed;z-index:5;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:14px;align-items:baseline;padding:7px 16px;border:1px solid var(--brass);border-radius:14px;background:var(--glass);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
#cans-hud b{font-family:var(--display);font-size:22px;color:var(--brass)}
#cans-hud.bump b{animation:cans-bump .28s}
#cans-hud.hurry{border-color:var(--seal);background:#c4122fe0}
#cans-hud.hurry #cans-time{display:inline-block;font-family:var(--display);font-size:22px;animation:cans-hurry .5s ease-in-out infinite}
@keyframes cans-hurry{50%{transform:scale(1.35)}}
#cans-go{position:fixed;z-index:9;left:0;right:0;top:17%;padding:0 18px;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(30px,9.5vw,58px);line-height:1.02;letter-spacing:-.01em;text-transform:uppercase;color:var(--brass);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 10px 26px #000a;pointer-events:none;animation:cans-go .42s cubic-bezier(.2,1.5,.4,1) both}
#cans-go small{display:block;margin-top:8px;font-family:var(--body);font-size:.34em;letter-spacing:.08em;color:var(--paper);-webkit-text-stroke:0;text-shadow:0 2px 6px #000c}
@keyframes cans-go{from{transform:scale(2.2) rotate(-5deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes cans-bump{50%{transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){#cans-go,#cans-hud.bump b,#cans-hud.hurry #cans-time{animation:none}}
.speech-send{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.speech-send:disabled{opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="pill" id="place"><b>Gramado</b><span>Chácara na represa</span></div>
  <div class="right">
    <button class="btn" type="button" id="b-view">Vista: recorte</button>
  </div>
</div>
<div id="joy" hidden><i></i></div>
<div class="hint l" id="hint-l" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3"/><circle cx="50" cy="50" r="17" fill="#fff"/><path d="M50 9l8 10H42zM50 91l8-10H42zM9 50l10-8v16zM91 50l-10-8v16z" fill="#fff"/></svg><span>andar</span></div>
<div class="hint r" id="hint-r" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3"/><path d="M26 44a26 26 0 1 1 5 24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M14 40l14 14 8-18z" fill="#fff"/><circle cx="50" cy="50" r="7" fill="#fff"/></svg><span>olhar</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="cans-hud" hidden><span id="cans-time"></span><span><b id="cans-score">0</b> pts</span></div>
<div id="cans-go" role="status" aria-live="assertive" hidden></div>
<div id="speech-left" class="speech-edge left"></div>
<div id="speech-right" class="speech-edge right"></div>
<div class="world-actions">
  <button id="light-switch" class="btn" type="button" hidden>Apertar</button>
  <button id="talk" class="btn" type="button" hidden></button>
</div>
<div id="speech-overlay" class="speech-overlay" hidden>
  <form id="speech-form" class="speech-form" aria-labelledby="speech-label">
    <label id="speech-label" for="speech-text"></label>
    <button id="speech-cancel" class="btn" type="button">Fechar</button>
    <input id="speech-text" name="message" type="text" maxlength="100" placeholder="Mensagem" autocomplete="off" enterkeyhint="send" required>
    <button id="speech-send" class="btn speech-send" type="submit">Enviar</button>
  </form>
</div>

      if(canReply(c)){if(replyUntil.get(c)>latest){latest=replyUntil.get(c);next=c;}continue;}
      if(latest||!canTalk(c))continue;
      var d=Math.hypot(c.pos.x-me.pos.x,c.pos.z-me.pos.z);

  /* rede do Comedouro: obstáculo que gira até 90° para o lado empurrado, trava e volta balançando */
  (function(){var held=false,k,c,R=.45;
    for(k=0;k<chars.length;k++){c=chars[k];if(c!==me&&!c.remote)continue;if(c===me&&(boat||me.st!==0))continue;
      var px=c.pos.x,pz=c.pos.z;if(pz<HAM_Z0-.3||pz>HAM_Z1+.3||Math.abs(px-HAM_X)>HAM_L+R+.4){if(c===me)hammockSide=0;continue;}
      var side=c===me?(hammockSide||(hammockSide=px<HAM_X+hammockD?-1:1)):(px<HAM_X+hammockD?-1:1),need=px-side*R-HAM_X;
      if(side<0&&need>hammockD){held=true;if(need>HAM_L){need=HAM_L;if(c===me)me.pos.x=HAM_X+HAM_L-R;}hammockD=need;}
      else if(side>0&&need<hammockD){held=true;if(need<-HAM_L){need=-HAM_L;if(c===me)me.pos.x=HAM_X-HAM_L+R;}hammockD=need;}}

    if(held)hammockV=0;else{hammockV+=(-11*Math.sin(ang)-1.5*hammockV)*dt;ang+=hammockV*dt;ang=Math.max(-1.5708,Math.min(1.5708,ang));hammockD=HAM_L*Math.sin(ang);}
    hammockSwing.rotation.x=ang;})();
  /* rede de vôlei: corda com as pontas presas; cada corpo encostado vira um ponto de apoio */
  (function(){var k,c,i,n=Math.max(1,Math.ceil(dt/.012)),h=dt/n,q,cons=[],wind=reduceMotion.matches?0:.5;
    for(k=0;k<chars.length;k++){c=chars[k];if(c!==me&&!c.remote)continue;if(c===me?(boat||me.st!==0||!!me.furniture):c.st!==0)continue;
      var px=c.pos.x,pz=c.pos.z;if(pz<NET_Z0||pz>NET_Z1||Math.abs(px-NET_X)>2.4){if(c===me)netSide=0;continue;}
      var side=c===me?(netSide||(netSide=px<NET_X+netAt(pz)?-1:1)):(px<NET_X+netAt(pz)?-1:1);
      if(c===me){var lim=netMax(pz),pen=side<0?px+NET_R-NET_X:NET_X-px+NET_R;

          px+=side*(.9+7.6*Math.pow(pen/lim,1.3))*dt;me.pos.x=px;}}
      cons.push(px,pz,side);}
    for(q=0;q<n;q++){
      for(i=1;i<NET_N;i++)netV[i]+=(900*(netU[i-1]+netU[i+1]-2*netU[i])-8*netU[i]-3.2*netV[i]+wind*Math.sin(tt*.9+i*.35))*h;
      for(i=1;i<NET_N;i++)netU[i]+=netV[i]*h;
      for(k=0;k<cons.length;k+=3)for(i=1;i<NET_N;i++){var dz=NET_Z0+(NET_Z1-NET_Z0)*i/NET_N-cons[k+1];if(Math.abs(dz)>=NET_R)continue;
        var cap=Math.sqrt(NET_R*NET_R-dz*dz),need=cons[k+2]<0?cons[k]+cap-NET_X:cons[k]-cap-NET_X;
        if(cons[k+2]<0?netU[i]<need:netU[i]>need){netU[i]=need;netV[i]=0;}}}
    for(k=0;k<netStrips.length;k++){var a=netStrips[k][0];for(i=0;i<=NET_N;i++){a.setX(i*2,NET_X+netU[i]*netStrips[k][1]);a.setX(i*2+1,NET_X+netU[i]*netStrips[k][2]);}a.needsUpdate=true;}})();
  /* bola */
  (function(){
    if(me){meVel.copy(me.pos).sub(mePrev).divideScalar(Math.max(dt,1e-3));meVel.y=0;if(meVel.length()>9)meVel.set(0,0,0);mePrev.copy(me.pos);}
    ballKick=false;ballAcc=Math.min(ballAcc+dt,.06);while(ballAcc>=1/120){ballStep(1/120,false);ballAcc-=1/120;}
    if(ballKick){ballMine=true;ballStill=0;ballRestSent=false;ballSend();}
    if(ballMine){
      if(ballGrounded&&bv.length()<.08){ballStill+=dt;if(ballStill>.35&&!ballRestSent){bv.set(0,0,0);ballRestSent=true;ballSend(true);}}
      else{ballStill=0;ballRestSent=false;if(ballDirty||performance.now()-ballSentAt>700)ballSend();}}
    ballLost=(ballWet&&bp.z<-55)||Math.abs(bp.x)>108||bp.z>96||bp.z<-145?ballLost+dt:0;
    if(ballLost>(ballMine||!roomOnline?5:11+ballJit)){bp.set(BALL_HOME[0],3.2,BALL_HOME[1]);bv.set(0,0,0);ballLost=0;ballMine=true;ballRestSent=false;ballSend(true);}

    var lift=Math.max(0,bp.y-BALL_R-ballFloor),sc=.55/(1+lift*.7);ballBlob.visible=!ballWet;ballBlob.position.set(ballMesh.position.x,ballFloor+.05,ballMesh.position.z);ballBlob.scale.set(sc,sc,1);})();

  for(i=0;i<capys.length;i++){var cp=capys[i];cp.g.position.y=cp.y+(cp.wet?Math.sin(tt*1.3+cp.ph)*.05:0);if(!cp.wet)cp.g.rotation.x=Math.sin(tt*.9+cp.ph)*.03;}
  flame.scale.set(1+Math.sin(tt*11)*.12,1+Math.sin(tt*7)*.2,1+Math.cos(tt*9)*.12);
  pool.position.y=.16+Math.sin(tt*1.5)*.015;
  if(!reduceMotion.matches){
    var lockAcceleration=-9.81/.94*Math.sin(gateLockAngle)-.65*gateLockVelocity+.42*Math.sin(tt*.8)+.2*Math.sin(tt*1.9+1.1)+.15*Math.sin(tt*3.1+.4);

  /* câmera e telhados */

  for(var q=0;q<8&&cx>-4.6&&cx<2.6&&cz>16.4&&cz<23.6&&cy<H(-1,20)+8.5;q++){dd*=.8;cx=f.x+Math.sin(a)*Math.cos(pp)*dd;cz=f.z+Math.cos(a)*Math.cos(pp)*dd;cy=fy+1.8+Math.sin(pp)*dd;}cy=Math.max(cy,H(cx,cz)+1.2,cz<-67?-1.6:-99);
  camPos.lerp(v.set(cx,cy,cz),Math.min(1,dt*(me?9:2)));camera.position.copy(camPos);tgt.set(f.x,fy+1.9,f.z);camera.lookAt(tgt);stars.position.copy(camPos);

    if(tt>=nextPositionSave){saveTravelPosition();nextPositionSave=tt+1;}
  }

  updateBuildingView(vmode,me?.pos,dt);

  if(me){var best=null;for(i=0;i<PLACES.length;i++){var P=PLACES[i];if(P.box?under(P.box,me.pos):Math.hypot(me.pos.x-P.x,me.pos.z-P.z)<P.r){best=P;break;}}
    if(best)setPlace(best.n,best.d);else setPlace('Gramado','Chácara na represa');}

  renderer.render(scene,camera);}
