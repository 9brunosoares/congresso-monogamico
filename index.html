<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ecebf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120f1b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Congresso">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XVI Congresso Monogâmico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular, coluna única de 520px, barra de abas fixa no rodapé; crachá de congresso como motivo, lacre vermelho como acento. */
:root{
  --bg:#ecebf2; --surface:#ffffff; --surface-2:#f5f4f9; --ink:#1b1530; --muted:#686280; --line:#dcd9e6;
  --seal:#c4122f; --on-seal:#ffffff; --brass:#a77f12; --brass-soft:#f4ead0;
  --good:#18794e; --good-soft:#dcf3e7; --bad:#c4122f; --bad-soft:#fbe3e6;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120f1b; --surface:#1d1829; --surface-2:#251f34; --ink:#f1eef8; --muted:#a39dbb; --line:#332c46;
  --seal:#ff4d68; --on-seal:#1a0710; --brass:#e2bd52; --brass-soft:#3a3018;
  --good:#5fd39b; --good-soft:#163428; --bad:#ff6b80; --bad-soft:#3b1620; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#120f1b; --surface:#1d1829; --surface-2:#251f34; --ink:#f1eef8; --muted:#a39dbb; --line:#332c46;
  --seal:#ff4d68; --on-seal:#1a0710; --brass:#e2bd52; --brass-soft:#3a3018;
  --good:#5fd39b; --good-soft:#163428; --bad:#ff6b80; --bad-soft:#3b1620; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* topo */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.brand{flex:1;min-width:0}
.brand .roman{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.2em;color:var(--seal)}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.me{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-weight:600;font-size:14px}
.demo{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin:-6px 0 12px;flex-wrap:wrap}
.demo b{color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

/* avatares */
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--seal);border:2px solid var(--surface)}
.av.sm{width:28px;height:28px;font-size:12px}
.av.lg{width:64px;height:64px;font-size:24px}
.av.xl{width:92px;height:92px;font-size:34px}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.next{background:var(--ink);color:var(--bg);border:0;position:relative;overflow:hidden}
.next .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.next h2{font-size:30px;font-weight:800;margin-top:4px}
.count{display:flex;gap:8px;margin-top:14px}
.count div{background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:12px;padding:8px 10px;min-width:64px;text-align:center}
.count b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1}
.count span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.prep{margin-top:14px;background:var(--seal);color:var(--on-seal);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.prep small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.pts{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--brass-soft);color:var(--brass)}
.pts.neg{background:var(--bad-soft);color:var(--bad)}
.pts.pos{background:var(--good-soft);color:var(--good)}
.sealmark{position:absolute;right:-18px;top:-18px;width:96px;height:96px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--bg) 30%,transparent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;color:color-mix(in srgb,var(--bg) 35%,transparent);transform:rotate(14deg)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec-h h3{font-size:20px;font-weight:700}
.link{background:none;border:0;color:var(--seal);font-weight:700;font-size:14px;padding:4px 0}

/* programação */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days button{flex:1;min-width:72px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px;text-align:center}
.days button b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1}
.days button span{font-size:12px;color:var(--muted);font-weight:600}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.75}
.slot{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot time{font-family:var(--f-mono);font-weight:700;font-size:15px;padding-top:2px}
.slot h4{margin:0;font-size:17px;font-family:var(--f-display);font-weight:700}
.slot .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.slot .note{font-size:14px;color:var(--muted);margin-top:4px}
.slot.done{opacity:.45}
.slot.now time{color:var(--seal)}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.live{background:var(--seal);color:var(--on-seal)}
.tag.prepn{background:var(--brass-soft);color:var(--brass)}

/* placar */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;text-align:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .block{width:100%;border-radius:14px 14px 4px 4px;padding:10px 4px;background:var(--surface-2);border:1px solid var(--line)}
.pod.p1 .block{background:var(--brass-soft);border-color:var(--brass);padding-block:18px}
.pod .block b{font-family:var(--f-mono);font-size:22px;display:block}
.pod .place{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--muted)}
.pod.p1 .place{color:var(--brass)}
.pod .nm{font-weight:700;font-size:14px;line-height:1.1}
.pod.p1 .av{outline:3px solid var(--brass);outline-offset:2px}
.crown{font-family:var(--f-display);font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--brass)}
.rank{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:26px 36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .pos{font-family:var(--f-mono);font-weight:700;color:var(--muted);text-align:right}
.rk.me-row .nm{color:var(--seal)}
.rk .nm{font-weight:700}
.rk .sub{font-size:12px;color:var(--muted)}
.rk .score{font-family:var(--f-mono);font-weight:700;font-size:18px}
.log{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.log:first-child{border-top:0}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rules h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.rules ul{list-style:none;margin:0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:6px}
.rules li{display:flex;justify-content:space-between;gap:6px}
@media (max-width:380px){.rules{grid-template-columns:1fr}}

/* contas */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}
.exp{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp .t{font-weight:700}
.exp .s{font-size:13px;color:var(--muted)}
.money{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.bal .money.pos{color:var(--good)} .bal .money.neg{color:var(--bad)}
.settle{display:grid;grid-template-columns:28px auto 28px 1fr auto;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.settle:first-child{border-top:0}
.arrow{color:var(--muted);font-weight:700}
.bigfig{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.bar.over i{background:var(--bad)}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .bar{grid-column:1/-1;height:8px}

/* mural */
.shame{position:relative;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.shame .stamp{position:absolute;right:12px;top:12px;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--seal);border:2px solid var(--seal);border-radius:6px;padding:2px 8px;transform:rotate(6deg)}
.shame.pend .stamp{color:var(--muted);border-color:var(--muted)}
.shame h4{margin:10px 0 4px;font-family:var(--f-display);font-size:20px}
.shame blockquote{margin:8px 0 0;padding-left:12px;border-left:3px solid var(--line);font-size:14px;color:var(--muted)}
.wanted{display:flex;gap:-8px}

/* botões */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--bg);font-size:15px}
.btn.seal{background:var(--seal);color:var(--on-seal)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.fab-row{display:flex;gap:8px;flex-wrap:wrap}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--seal)}

/* folha (modal) */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto}
.sheet h3{font-size:24px;font-weight:800;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:500}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick button{border:2px solid transparent;background:var(--surface-2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.1;text-align:center}
.pick button[aria-pressed="true"]{border-color:var(--seal);background:var(--surface)}
.pick .av{width:52px;height:52px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60}

/* login */
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:24px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.badge .lanyard{background:var(--seal);color:var(--on-seal);padding:14px 18px;font-family:var(--f-display);font-weight:800;letter-spacing:.14em;font-size:13px;display:flex;justify-content:space-between}
.badge .body{padding:20px 18px}
.badge h1{font-size:44px;font-weight:800;letter-spacing:-.02em}
.badge h1 em{font-style:normal;color:var(--seal)}
.adm{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;padding:2px 6px;border-radius:5px;background:var(--brass);color:var(--surface);vertical-align:middle}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.count b{transition:color .2s}.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* queridômetro */
.emo-strip{font-size:20px;letter-spacing:2px;white-space:nowrap}
.qtitle{font-size:22px;font-weight:800;margin-top:4px}
.qrow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.qrow:first-child{border-top:0}
.qpick{font-size:22px}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emo button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 0;font-size:19px;line-height:1;filter:grayscale(.35);opacity:.8}
.emo button[aria-pressed="true"]{background:var(--surface);border:2px solid var(--seal);filter:none;opacity:1;transform:scale(1.08)}
.qhls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qhl{display:flex;gap:10px;align-items:center;min-width:0}
.qn{font-family:var(--f-mono);font-weight:700;font-size:13px}
.qres{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qres:first-child{border-top:0}
.qres .nm{font-weight:700}
.qres.me-row .nm{color:var(--seal)}
.qchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.qchip{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 6px;font-size:15px}
.qchip b{font-family:var(--f-mono);font-size:12px}
/* chat */
.seg.seg2{grid-template-columns:1fr 1fr}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{align-self:flex-start;max-width:85%;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15px;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:16px 4px 16px 16px}
.bubble .who{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.bubble.mine .who{color:inherit;opacity:.7}
.bubble .del{font-size:12px;padding:2px 0 0}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;margin-top:14px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.composer input{flex:1;min-width:0;border:0;background:transparent;padding:8px;font-size:16px;color:var(--ink)}
.composer input:focus{outline:none}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="root"></div>

function seedQuerido(dayNum){
  const out={};
  ALL.forEach((id,k)=>{
    const c={}; let s=(k+1)*7919+dayNum*104729;
    const bias = {igor:[0,0,0,5],thiago:[0,0,0,5],diogo:[0,0,5],guilherme:[2,4,6],rafa:[5,4,1],luan:[4,4,5],guiob:[4,5],caio:[0,0,0,5],gabriel:[0,0,5]}[id]||[];
    for(let v=0;v<11;v++){ s=(s*1103515245+12345)>>>0; let e = v<bias.length ? bias[v] : (s>>>8)%9; if(e>7) e=0; const em=EMOJIS[e]; c[em]=(c[em]||0)+1; }
    out[id]=c;
  });
  return out;
}

function balances(){
  const b = Object.fromEntries(ALL.map(id=>[id,0]));
  S.exps.forEach(e=>{ const share=e.amount/e.split.length; b[e.payer]+=e.amount; e.split.forEach(id=>b[id]-=share); });
  return b;
}
function settle(){
  const b = balances();
  const cred = ALL.filter(id=>b[id]>0.005).map(id=>({id,v:b[id]})).sort((a,c)=>c.v-a.v);
  const debt = ALL.filter(id=>b[id]<-0.005).map(id=>({id,v:-b[id]})).sort((a,c)=>c.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<debt.length && j<cred.length){
    const v=Math.min(debt[i].v,cred[j].v); out.push({from:debt[i].id,to:cred[j].id,v});
    debt[i].v-=v; cred[j].v-=v; if(debt[i].v<0.01)i++; if(cred[j].v<0.01)j++;
  }
  return out;
}

  }
  if(contasSeg==="orcamento"){
    const pct=Math.min(100,total/S.budget*100), left=S.budget-total;
    body=`<div class="card" style="margin-top:12px">
      <div class="eyebrow">Orçamento do congresso</div>
      <div class="row" style="align-items:baseline;margin:6px 0 10px"><div class="bigfig num">${brl0(total)}</div><span class="muted">de ${brl0(S.budget)}</span></div>
      <div class="bar ${total>S.budget?"over":""}"><i style="width:${pct}%"></i></div>
      <div class="row" style="justify-content:space-between;margin-top:8px;font-size:14px"><span class="muted">${Math.round(total/S.budget*100)}% usado</span><b style="color:${left>=0?"var(--good)":"var(--bad)"}">${left>=0?`Sobram ${brl0(left)}`:`Estourou ${brl0(-left)}`}</b></div>
      <div class="muted" style="font-size:13px;margin-top:6px">Por pessoa: ${brl0(total/ALL.length)} gastos de ${brl0(S.budget/ALL.length)} previstos</div>
      ${isAdm()?`<button class="btn sm ghost" style="margin-top:12px" id="editBudget" type="button">Ajustar orçamento (ADM)</button>`:""}
    </div>
    <div class="sec-h"><h3>Por categoria</h3></div>
    <div class="card" style="padding-block:4px">${CATS.map(c=>{const s=S.exps.filter(e=>e.cat===c.id).reduce((a,e)=>a+e.amount,0);return `<div class="cat"><b>${c.name}</b><span class="money" style="font-size:14px">${brl0(s)} <span class="muted" style="font-weight:500">/ ${brl0(c.budget)}</span></span><div class="bar ${s>c.budget?"over":""}"><i style="width:${Math.min(100,s/c.budget*100)}%"></i></div></div>`}).join("")}</div>`;
  }
  return seg+body;
}

function todayNum(){ const t=now(); const d=new Date(t).getDate(); return DAYS.some(x=>x.d===d)?d:null; }

function viewQuerido(){
  const d = todayNum() || 20;
  if(!S.querido[d]) S.querido[d] = Object.fromEntries(ALL.map(id=>[id,{}]));
  const voted = (S.qvoted[d]||[]).includes(S.me);
  const res = S.querido[d];
  const total = id => Object.values(res[id]||{}).reduce((a,b)=>a+b,0);
  const top = em => ALL.map(id=>({id,n:(res[id]||{})[em]||0})).sort((a,b)=>b.n-a.n)[0];
  const highlights = [["❤️","Mais amado"],["🐍","Mais cobra"],["🍪","Mais biscoiteiro"],["🎯","Mais alvo"]].map(([em,l])=>{const t=top(em);return t.n?`<div class="qhl">${av(t.id)}<div><div class="eyebrow">${l}</div><b>${esc(first(t.id))}</b> <span class="qn">${em} ${t.n}</span></div></div>`:""}).join("");
  const others = ALL.filter(id=>id!==S.me);
  const form = voted ? "" : `
    <div class="card"><div class="eyebrow">Votação da manhã · ${dayOf(now())?.wd||"Sex"} ${d}/11</div>
      <h2 class="qtitle">Dê um emoji para cada congressista</h2>
      <p class="muted" style="margin:6px 0 0;font-size:14px">Anônimo: o app só guarda quantos emojis cada um recebeu, nunca quem deu.</p>
    </div>
    <div class="card" style="margin-top:12px;padding-block:4px">${others.map(id=>`<div class="qrow">
      <div class="row">${av(id,"sm")}<b class="grow">${esc(P[id].name)}</b>${qDraft[id]?`<span class="qpick">${qDraft[id]}</span>`:""}</div>
      <div class="emo" role="group" aria-label="Emoji para ${esc(P[id].name)}">${EMOJIS.map(em=>`<button type="button" data-q="${id}" data-em="${em}" aria-pressed="${qDraft[id]===em}">${em}</button>`).join("")}</div>
    </div>`).join("")}</div>
    <button class="btn seal block" style="margin-top:14px" id="qSend" type="button">Enviar votos (${Object.keys(qDraft).filter(k=>others.includes(k)).length} de ${others.length})</button>`;
  const results = `
    <div class="sec-h"><h3>Resultado de ${dayOf(now())?.wd||"Sex"}</h3><span class="muted" style="font-size:13px">${(S.qvoted[d]||[]).length + 11} votantes</span></div>
    ${highlights?`<div class="card qhls">${highlights}</div>`:""}
    <div class="card" style="margin-top:12px;padding-block:4px">${ALL.slice().sort((a,b)=>((res[b]||{})["❤️"]||0)-((res[a]||{})["❤️"]||0)).map(id=>{
      const c=res[id]||{}; const chips=EMOJIS.filter(em=>c[em]).sort((a,b)=>c[b]-c[a]).map(em=>`<span class="qchip">${em}<b>${c[em]}</b></span>`).join("");
      return `<div class="qres ${id===S.me?"me-row":""}">${av(id)}<div style="min-width:0"><div class="nm">${esc(P[id].name)}</div><div class="qchips">${chips||'<span class="muted" style="font-size:13px">sem votos ainda</span>'}</div></div><span class="muted num" style="font-size:13px">${total(id)}</span></div>`}).join("")}</div>`;
  return (voted?`<div class="card row"><span class="emo-strip" aria-hidden="true">✅</span><div class="grow">Seus votos de hoje foram enviados. Amanhã de manhã abre de novo.</div></div>`:form) + results;
}

function sheet(html, onMount){
  const s=document.createElement("div"); s.className="scrim";
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click",e=>{ if(e.target===s||e.target.closest("[data-close]")) s.remove(); });
  document.body.appendChild(s); onMount&&onMount(s);
  return s;
}

function sheetExpense(){
  let split=new Set(ALL);
  sheet(`<h3>Lançar gasto</h3><div class="stack">
    <label class="f">O que foi<input id="exT" placeholder="Ex.: gelo e limão"></label>
    <label class="f">Valor (R$)<input id="exV" type="number" inputmode="decimal" step="0.01" placeholder="0,00"></label>
    <label class="f">Quem pagou<select id="exP">${personOpts(S.me)}</select></label>
    <label class="f">Categoria<select id="exC">${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}</select></label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)"><span>Dividir entre <button class="link" id="exAll" type="button" style="font-size:13px">todos / ninguém</button></span>
      <div class="pick" id="exS">${PEOPLE.map(p=>`<button type="button" data-id="${p.id}" aria-pressed="true">${av(p.id)}<span>${esc(first(p.id))}</span></button>`).join("")}</div></div>
    <button class="btn block" id="exOk" type="button">Salvar gasto</button>
    <button class="btn ghost block" data-close type="button">Cancelar</button></div>`, s=>{
      const sync=()=>s.querySelectorAll("#exS button").forEach(b=>b.setAttribute("aria-pressed",split.has(b.dataset.id)));
      s.querySelector("#exS").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id;split.has(id)?split.delete(id):split.add(id);sync();};
      s.querySelector("#exAll").onclick=()=>{split=split.size?new Set():new Set(ALL);sync();};
      s.querySelector("#exOk").onclick=()=>{
        const title=s.querySelector("#exT").value.trim(), amount=parseFloat(String(s.querySelector("#exV").value).replace(",","."));
        if(!title||!(amount>0)){toast("Preencha o que foi e o valor");return;}
        if(!split.size){toast("Escolha com quem dividir");return;}
        S.exps.push({id:Date.now(),title,amount,payer:s.querySelector("#exP").value,cat:s.querySelector("#exC").value,split:[...split],at:stamp()});
        save(); s.remove(); render(); toast("Gasto lançado");
      };
    });
}

function stamp(){ const t=now(); return `${dayOf(t)?.wd||""} ${fmtTime(t)}`.trim(); }

const ICONS={
  inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  programa:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  placar:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',

  querido:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',

};
const LABELS={inicio:"Início",programa:"Programa",placar:"Placar",querido:"Querido",contas:"Contas",fofoca:"Fofoca"};

function go(t){ if(t==="mural"){ t="fofoca"; fofocaSeg="mural"; } tab=t; try{localStorage.setItem("xvi-tab",t);}catch(e){} render(); scrollTo({top:0}); }

function render(){
  if(!S.me || !P[S.me]){ viewLogin(); return; }
  const body = ({inicio:viewInicio,programa:viewPrograma,placar:viewPlacar,querido:viewQuerido,contas:viewContas,fofoca:viewFofoca}[tab]||viewInicio)();
  $("#root").innerHTML = `<div class="app">${header()}<main>${body}</main>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:28px">Rascunho com dados de exemplo. Datas, valores e pontos são fictícios.</p></div>
    <nav class="tabs" aria-label="Seções"><div class="tabs-in">${Object.keys(LABELS).map(k=>`<button type="button" data-go="${k}" ${k===tab?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${LABELS[k]}</button>`).join("")}</div></nav>`;
  tick();
}

document.addEventListener("click",e=>{
  if(e.target.closest(".scrim")) return;
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const d=e.target.closest("[data-day]"); if(d){ day=+d.dataset.day; render(); return; }
  const fs=e.target.closest("[data-fseg]"); if(fs){ fofocaSeg=fs.dataset.fseg; render(); return; }
  const q=e.target.closest("[data-q]"); if(q){ qDraft[q.dataset.q] = qDraft[q.dataset.q]===q.dataset.em ? undefined : q.dataset.em; if(!qDraft[q.dataset.q]) delete qDraft[q.dataset.q]; const y=scrollY; render(); scrollTo(0,y); return; }
  const dl=e.target.closest("[data-del]"); if(dl){ S.chat=S.chat.filter(m=>m.id!=dl.dataset.del); save(); render(); toast("Mensagem apagada"); return; }
  const sg=e.target.closest("[data-seg]"); if(sg){ contasSeg=sg.dataset.seg; render(); return; }
  const j=e.target.closest("[data-judge]"); if(j){ const s=S.shame.find(x=>x.id==j.dataset.judge);
    if(j.dataset.v==="ok"){ s.status="ok"; S.points.push({who:s.who,d:-15,why:"Infração da monogamia (Mural)",kind:"inf",at:stamp()}); toast(`${first(s.who)} condenado: −15`); }
    else { S.shame=S.shame.filter(x=>x!==s); toast(`${first(s.who)} absolvido`); }
    save(); render(); return; }
  const id=e.target.closest("button")?.id;
  ({meBtn:sheetMe,quickReport:sheetTask,quickExp:sheetExpense,givePts:()=>sheetPoints(false),takePts:()=>sheetPoints(true),report:sheetReport,editBudget:sheetBudget,addAct:sheetActivity,
    qSend:()=>{ const d=todayNum()||20, others=ALL.filter(id=>id!==S.me), miss=others.filter(id=>!qDraft[id]).length;
      if(miss){ toast(`Falta${miss>1?"m":""} ${miss} congressista${miss>1?"s":""}`); return; }
      others.forEach(id=>{ const c=S.querido[d][id]||(S.querido[d][id]={}); c[qDraft[id]]=(c[qDraft[id]]||0)+1; });
      (S.qvoted[d]||(S.qvoted[d]=[])).push(S.me); qDraft={}; save(); render(); scrollTo({top:0}); toast("Votos enviados, anonimamente"); },
    clockBtn:()=>{demo=!demo;render();toast(demo?"Relógio de demonstração: sexta 15:40":"Usando o relógio real");}})[id]?.();
});

function tick(){
  const c=$("#clock"); if(c){ const t=now(); c.textContent=`${dayOf(t)?dayOf(t).wd+" "+new Date(t).getDate()+"/11":new Date(t).toLocaleDateString("pt-BR")} ${new Date(t).toLocaleTimeString("pt-BR")}`; }
  const box=$("#count"); const {nxt}=nextItem();
  if(box&&nxt){ let s=Math.max(0,Math.floor((nxt.start-now())/1000)); const dd=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
    const parts = dd?[[dd,"dias"],[h,"h"],[m,"min"]]:[[h,"h"],[m,"min"],[s,"seg"]];
    box.innerHTML=parts.map(([v,l])=>`<div><b>${String(v).padStart(2,"0")}</b><span>${l}</span></div>`).join(""); }
}
document.addEventListener("submit",e=>{
  if(e.target.id!=="chatForm") return; e.preventDefault();
  const v=$("#chatIn").value.trim(); if(!v) return;
  S.chat.push({id:Date.now(),text:v,at:stamp(),mine:true}); save(); render();
  const l=$("#chatList"); if(l) l.lastElementChild?.scrollIntoView({block:"end"}); $("#chatIn")?.focus();
});
setInterval(tick,1000);
render();
</script>
